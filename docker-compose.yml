services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: changelens-app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/changelens}
      SESSION_SECRET: ${SESSION_SECRET:-changelens-docker-session-secret-change-in-prod-32chars}
      OTP_SECRET: ${OTP_SECRET:-changelens-docker-otp-secret-change-in-prod-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:5000/api/v1/auth/github/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5000/api/v1/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - changelens_repo_cache:/app/.changelens-cache
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: changelens-mongo
    ports:
      - "27017:27017"
    volumes:
      - changelens_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  changelens_mongo_data:
  changelens_repo_cache:
