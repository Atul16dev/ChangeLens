<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b1328" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="10" y1="12" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="prismGrad" x1="27" y1="21" x2="35" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="impactGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </radialGradient>
  </defs>

  <!-- Rounded Sapphire Brand Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2" />

  <!-- Centered Static Brand Mark -->
  <g transform="translate(8, 8) scale(0.75)">
    <path
      d="M 46.2 18.3 A 20.5 20.5 0 1 0 46.2 45.7"
      stroke="url(#ringGrad)"
      stroke-width="6.2"
      stroke-linecap="round"
    />
    <polygon points="27,21.5 27,42.5 19,32" fill="#ffffff" />
    <polygon points="27,21.5 35,32 27,42.5" fill="url(#prismGrad)" />
    <path
      d="M 38.4 24.1 A 13.5 13.5 0 0 1 38.4 39.9"
      stroke="#67e8f9"
      stroke-width="3.8"
      stroke-linecap="round"
    />
    <circle cx="51.5" cy="32" r="4.5" fill="url(#impactGrad)" />
  </g>
</svg>
